<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - FurniHaven</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
    @media (max-width: 768px) { .profile-grid { grid-template-columns: 1fr; } }
    .profile-card, .orders-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .profile-card h2, .orders-card h2 { color: #2c3e50; margin-bottom: 20px; }
    .profile-card .form-group { margin-bottom: 16px; }
    .profile-card label { display: block; margin-bottom: 5px; font-weight: 500; }
    .profile-card input { width: 100%; padding: 10px 14px; border: 1px solid #e8e0d5; border-radius: 8px; background: #f8f5f0; }
    .order-item { border-bottom: 1px solid #eee; padding: 15px 0; }
    .order-item:last-child { border-bottom: none; }
    .badge-status { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-confirmed { background: #d4edda; color: #155724; }
    .badge-shipped { background: #cce5ff; color: #004085; }
    .badge-delivered { background: #d1e7dd; color: #0f5132; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">Free Shipping on Orders Above ₹15,000</div>
    <div class="container header-main">
      <a href="index.html" class="logo">Furni<span>Haven</span></a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="profile.html" class="active">Profile</a>
        <a href="#" id="logout-btn">Logout</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-btn">🛒 <span class="cart-count">0</span></a>
        <button class="menu-toggle">☰</button>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1>My Profile</h1>
      <p>Manage your account and view orders</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="profile-grid">
        <div class="profile-card">
          <h2>Profile Details</h2>
          <form id="profile-form">
            <div class="form-group">
              <label>Name</label>
              <input type="text" name="name" id="p-name" required>
            </div>
            <div class="form-group">
              <label>Email (cannot change)</label>
              <input type="email" id="p-email" disabled style="opacity:0.7;">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" name="phone" id="p-phone">
            </div>
            <div class="form-group">
              <label>Address</label>
              <input type="text" name="address" id="p-address">
            </div>
            <div class="form-group">
              <label>City</label>
              <input type="text" name="city" id="p-city">
            </div>
            <div class="form-group">
              <label>Pincode</label>
              <input type="text" name="pincode" id="p-pincode">
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
        <div class="orders-card">
          <h2>My Orders</h2>
          <div id="my-orders">Loading...</div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script>
    const token = localStorage.getItem('fh_token');
    if (!token) window.location.href = 'login.html';

    async function loadProfile() {
      const res = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
      const json = await res.json();
      if (!json.success) { window.location.href = 'login.html'; return; }
      const u = json.user;
      document.getElementById('p-name').value = u.name || '';
      document.getElementById('p-email').value = u.email || '';
      document.getElementById('p-phone').value = u.phone || '';
      document.getElementById('p-address').value = u.address || '';
      document.getElementById('p-city').value = u.city || '';
      document.getElementById('p-pincode').value = u.pincode || '';
    }

    async function loadOrders() {
      const res = await fetch('/api/my-orders', { headers: { Authorization: 'Bearer ' + token } });
      const json = await res.json();
      const el = document.getElementById('my-orders');
      if (!json.success || !json.data.length) {
        el.innerHTML = '<p style="color:#666;">No orders yet. <a href="shop.html">Shop now</a></p>';
        return;
      }
      el.innerHTML = json.data.map(o => `
        <div class="order-item">
          <strong>Order #${o.id}</strong>
          <span class="badge-status badge-${o.status}">${o.status}</span><br>
          <small>${o.created_at}</small><br>
          Total: ₹${Number(o.total_amount).toLocaleString('en-IN')}<br>
          ${o.city || ''} ${o.address || ''}
        </div>
      `).join('');
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const res = await fetch('/api/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({
          name: fd.get('name'), phone: fd.get('phone'),
          address: fd.get('address'), city: fd.get('city'), pincode: fd.get('pincode')
        })
      });
      const json = await res.json();
      if (json.success) {
        localStorage.setItem('fh_user', JSON.stringify(json.user));
        alert('Profile updated!');
      } else alert(json.message || 'Failed');
    });

    document.getElementById('logout-btn').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
      localStorage.removeItem('fh_token');
      localStorage.removeItem('fh_user');
      window.location.href = 'index.html';
    });

    loadProfile();
    loadOrders();
  </script>
</body>
</html>

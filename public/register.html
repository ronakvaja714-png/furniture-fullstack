<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FurniHaven</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-box { max-width: 420px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .auth-box h1 { text-align: center; color: #2c3e50; margin-bottom: 8px; }
    .auth-box .sub { text-align: center; color: #666; margin-bottom: 30px; }
    .auth-box .form-group { margin-bottom: 18px; }
    .auth-box label { display: block; margin-bottom: 6px; font-weight: 500; color: #2c3e50; }
    .auth-box input { width: 100%; padding: 12px 16px; border: 1px solid #e8e0d5; border-radius: 8px; font-size: 1rem; background: #f8f5f0; }
    .auth-box input:focus { outline: none; border-color: #8b5a2b; background: white; }
    .auth-box .btn { width: 100%; margin-top: 10px; }
    .auth-box .link { text-align: center; margin-top: 20px; }
    .auth-box .link a { color: #8b5a2b; font-weight: 600; }
    .error { background: #fee; color: #c0392b; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">Free Shipping on Orders Above ₹15,000</div>
    <div class="container header-main">
      <a href="index.html" class="logo">Furni<span>Haven</span></a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="register.html" class="active">Register</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-btn">🛒 <span class="cart-count">0</span></a>
        <button class="menu-toggle">☰</button>
      </div>
    </div>
  </header>

  <div class="auth-box">
    <h1>Create Account</h1>
    <p class="sub">Join FurniHaven today</p>
    <div class="error" id="error"></div>
    <form id="register-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" name="phone" placeholder="+91 98765 43210">
      </div>
      <div class="form-group">
        <label>Password (min 6 characters)</label>
        <input type="password" name="password" required minlength="6" placeholder="Choose password">
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="link">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: fd.get('name'),
            email: fd.get('email'),
            phone: fd.get('phone'),
            password: fd.get('password')
          })
        });
        const json = await res.json();
        if (json.success) {
          localStorage.setItem('fh_token', json.token);
          localStorage.setItem('fh_user', JSON.stringify(json.user));
          window.location.href = 'profile.html';
        } else {
          errorEl.textContent = json.message || 'Registration failed';
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.textContent = 'Server not running.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
